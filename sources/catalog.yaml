# Source catalog for Sensei Ewok Research
#
# One entry per external source we rely on. This file is the single place that
# says what a source is, where it lives, and what we are permitted to do with
# it. Tools and agents read this file instead of hardcoding URLs or guessing
# at terms.
#
# Field reference and the rules an agent must follow: sources/README.md
# Access policy evidence (what was tested, when): landscape/registry-data-access.md

schema_version: 1
updated: 2026-10-08

# access  : fetch     - automated download is permitted; tools may retrieve it
#           api       - queryable API, permitted; not a file download
#           manual    - a human must download it in a browser; never automate
#           request   - access requires an application or written permission
#           forbidden - the publisher has explicitly refused automated access
# robots  : allow | disallow | unknown | unreadable
# redistribute : may we commit or host the file itself? default false

defaults:
  redistribute: false

sources:

